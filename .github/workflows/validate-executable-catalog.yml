name: Validate executable catalog

on:
  push:
    branches: [feat/operational-catalog-v1]
  pull_request:
    branches: [feat/operational-catalog-v1]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested SHA
        uses: actions/checkout@v4

      - name: Show tested SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Install web dependencies
        working-directory: web
        run: npm install --ignore-scripts

      - name: Run catalog and runtime tests
        run: |
          node --test \
            catalog/compiler/*.test.js \
            catalog/versions/v1.0.0/executable_luminaria.test.js \
            catalog/versions/v1.0.0/executable_esmeril.test.js \
            catalog/versions/v1.0.0/executable_torque_manual.test.js \
            web/lib/xls/*.test.mjs \
            web/lib/versioned_renderer_runtime.test.mjs \
            web/lib/catalog_reprocess_worker_runtime.test.mjs

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Resolve tested Vercel deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..30}; do
            deployments=$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/deployments?sha=$GITHUB_SHA")
            statuses_url=$(jq --raw-output '.[0].statuses_url // empty' <<< "$deployments")
            if [ -n "$statuses_url" ]; then
              deployment=$(curl --fail --silent --show-error \
                --header "Authorization: Bearer $GH_TOKEN" "$statuses_url")
              state=$(jq --raw-output '.[0].state // empty' <<< "$deployment")
              url=$(jq --raw-output '.[0].environment_url // empty' <<< "$deployment")
              echo "Vercel deployment state: ${state:-pending}"
              if [ "$state" = "success" ] && [ -n "$url" ]; then
                echo "TEMPLATE_BASE_URL=$url" >> "$GITHUB_ENV"
                echo "Testing deployment: $url"
                exit 0
              fi
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
                exit 1
              fi
            fi
            sleep 2
          done
          echo "Vercel deployment did not become ready for $GITHUB_SHA"
          exit 1

      - name: Diagnose deployed template endpoints
        run: |
          ps -ef
          for family in luminaria esmeril; do
            url="$TEMPLATE_BASE_URL/api/template/$family"
            status=$(curl --silent --show-error --output "/tmp/$family.body" --write-out '%{http_code}' "$url")
            echo "$family HTTP $status"
            echo "$family bytes $(wc -c < "/tmp/$family.body")"
            file "/tmp/$family.body"
            if unzip -t "/tmp/$family.body" >/tmp/$family.zip-test 2>&1; then
              echo "$family ZIP valid"
              unzip -l "/tmp/$family.body" | grep -E "xl/(workbook|worksheets|_rels)" | head -30
              if [ "$family" = "esmeril" ]; then
                echo "ESMERIL workbook.xml:"
                unzip -p "/tmp/$family.body" xl/workbook.xml
                echo
              fi
            else
              echo "$family ZIP invalid"
              cat /tmp/$family.zip-test
            fi
            if [ "$status" != "200" ]; then
              echo "$family response body:"
              head -c 2000 "/tmp/$family.body"
              exit 1
            fi
          done

      - name: Run LUMINARIA real-byte integration test
        env:
          LUMINARIA_TEMPLATE_URL: ${{ env.TEMPLATE_BASE_URL }}/api/template/luminaria
        run: node --test web/lib/executable_luminaria.integration.test.mjs

      - name: Run ESMERIL real-byte integration test
        env:
          ESMERIL_TEMPLATE_URL: ${{ env.TEMPLATE_BASE_URL }}/api/template/esmeril
        run: node --test web/lib/executable_esmeril.integration.test.mjs

      - name: Run TORQUE_MANUAL real-byte integration test
        env:
          TORQUE_MANUAL_TEMPLATE_URL: ${{ env.TEMPLATE_BASE_URL }}/api/template/torque-manual
        run: node --test web/lib/executable_torque_manual.integration.test.mjs
