name: Diagnose executable LUMINARIA

on:
  pull_request:
    branches:
      - feat/operational-catalog-v1
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout current catalog branch
        uses: actions/checkout@v4
        with:
          ref: feat/operational-catalog-v1

      - name: Show validated commit
        run: git rev-parse HEAD

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: web
        run: npm install --ignore-scripts

      - name: Run LUMINARIA integration test
        run: node --test web/lib/executable_luminaria.integration.test.mjs
