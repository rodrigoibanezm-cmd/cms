name: Diagnose LUMINARIA integration

on:
  pull_request:
    branches:
      - feat/operational-catalog-v1
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: web
        run: npm install --ignore-scripts

      - name: Test LUMINARIA integration
        run: node --test web/lib/executable_luminaria.integration.test.mjs

      - name: Build
        if: always()
        working-directory: web
        run: npm run build
