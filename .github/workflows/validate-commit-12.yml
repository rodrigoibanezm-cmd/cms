name: Validate executable catalog

on:
  push:
    branches: [feat/operational-catalog-v1]
  pull_request:
    branches: [feat/operational-catalog-v1]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_DRIVE_AUTH_MODE: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' && 'service_account' || '' }}
    steps:
      - name: Checkout tested SHA
        uses: actions/checkout@v4

      - name: Show tested SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Install web dependencies
        working-directory: web
        run: npm install --ignore-scripts

      - name: Run catalog and runtime tests
        run: |
          node --test \
            catalog/compiler/*.test.js \
            catalog/versions/v1.0.0/executable_luminaria.test.js \
            catalog/versions/v1.0.0/executable_esmeril.test.js \
            web/lib/xls/*.test.mjs \
            web/lib/versioned_renderer_runtime.test.mjs \
            web/lib/catalog_reprocess_worker_runtime.test.mjs

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Start built web server
        working-directory: web
        run: npm start > /tmp/cms-next.log 2>&1 &

      - name: Diagnose local template endpoints
        run: |
          echo "GOOGLE_CLIENT_ID set: ${{ secrets.GOOGLE_CLIENT_ID != '' }}"
          echo "GOOGLE_CLIENT_SECRET set: ${{ secrets.GOOGLE_CLIENT_SECRET != '' }}"
          echo "GOOGLE_REFRESH_TOKEN set: ${{ secrets.GOOGLE_REFRESH_TOKEN != '' }}"
          echo "GOOGLE_SERVICE_ACCOUNT_JSON set: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}"
          ps -ef
          for attempt in {1..30}; do
            curl --silent --output /dev/null http://127.0.0.1:3000 && break
            sleep 1
          done
          cat /tmp/cms-next.log
          for family in luminaria esmeril; do
            url="http://127.0.0.1:3000/api/template/$family"
            status=$(curl --silent --show-error --output "/tmp/$family.body" --write-out '%{http_code}' "$url")
            echo "$family HTTP $status"
            echo "$family bytes $(wc -c < "/tmp/$family.body")"
            if [ "$status" != "200" ]; then
              echo "$family response body:"
              head -c 2000 "/tmp/$family.body"
              exit 1
            fi
          done

      - name: Run LUMINARIA real-byte integration test
        env:
          LUMINARIA_TEMPLATE_URL: http://127.0.0.1:3000/api/template/luminaria
        run: node --test web/lib/executable_luminaria.integration.test.mjs

      - name: Run ESMERIL real-byte integration test
        env:
          ESMERIL_TEMPLATE_URL: http://127.0.0.1:3000/api/template/esmeril
        run: node --test web/lib/executable_esmeril.integration.test.mjs
