name: Validate commit 12

on:
  pull_request:
    branches:
      - feat/operational-catalog-v1
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: web
        run: npm install --ignore-scripts

      - name: Diagnose test files
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          files=(
            catalog/compiler/*.test.js
            catalog/versions/v1.0.0/executable_luminaria.test.js
            web/lib/xls/*.test.mjs
            web/lib/versioned_renderer_runtime.test.mjs
            web/lib/catalog_reprocess_worker_runtime.test.mjs
            web/lib/executable_luminaria.integration.test.mjs
          )
          for file in "${files[@]}"; do
            echo "::group::TEST FILE: $file"
            node --test "$file"
            status=$?
            echo "EXIT STATUS: $status"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "FAILED TEST FILE: $file"
              failures=$((failures + 1))
            fi
          done
          echo "TOTAL FAILED TEST FILES: $failures"
          exit "$failures"

      - name: Build
        working-directory: web
        run: npm run build
